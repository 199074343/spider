name: 爬虫项目测试

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: 设置Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: 设置Node.js (for Appium)
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk

    - name: 缓存Python依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 安装Python依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装Appium
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: 运行冒烟测试
      run: python test_automation.py smoke --verbose

    - name: 运行单元测试
      run: python run_tests.py --suite spider --verbose

    - name: 运行工具模块测试
      run: python run_tests.py --suite utils --verbose

    - name: 运行集成测试
      run: python run_tests.py --suite integration --verbose

    - name: 生成测试报告
      run: python run_tests.py --output-format all --verbose

    - name: 运行覆盖率分析
      run: python test_automation.py coverage --verbose

    - name: 上传测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-python-${{ matrix.python-version }}
        path: reports/

    - name: 上传测试结果
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: reports/test_results.xml

  mobile-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: 设置Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: 设置Android SDK
      uses: android-actions/setup-android@v2

    - name: 安装Python依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 创建AVD
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-30;google_apis;x86_64"
        echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd --force --name test_avd --abi google_apis/x86_64 --package "system-images;android-30;google_apis;x86_64"

    - name: 启动模拟器
      run: |
        $ANDROID_HOME/emulator/emulator -avd test_avd -no-audio -no-window &
        adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed | tr -d '\''\r'\'') ]]; do sleep 1; done; input keyevent 82'

    - name: 安装Appium
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: 启动Appium服务器
      run: |
        appium --port 4723 &
        sleep 10

    - name: 运行移动端测试
      run: python run_tests.py --suite mobile --verbose

    - name: 上传移动端测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: mobile-test-reports
        path: reports/